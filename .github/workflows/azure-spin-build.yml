name: Azure readiness - Spin the Bottle

on:
  workflow_dispatch:
  push:
    paths:
      - "games/spin-the-bottle/**"
      - "packages/platform-contracts/**"
      - "packages/realtime-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-spin-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Readiness-only values. A deployment workflow must map real Azure URLs.
      VITE_API_URL: https://api.example.invalid
      VITE_PLATFORM_URL: https://platform.example.invalid
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Require public build configuration
        run: test -n "$VITE_API_URL" && test -n "$VITE_PLATFORM_URL"
      - run: npm ci
      - run: npm run build:spin-the-bottle
      - uses: actions/upload-artifact@v7
        with:
          name: spin-the-bottle-app-service
          path: games/spin-the-bottle/dist
