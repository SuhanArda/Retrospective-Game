name: Azure readiness - AI Bot

on:
  workflow_dispatch:
  push:
    paths:
      - "ai-bot/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-ai-bot-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run test:ai-bot
      - run: npm run build:ai-bot
      - uses: actions/upload-artifact@v7
        with:
          name: ai-bot-app-service
          path: ai-bot/dist

