name: Azure readiness - Wheel of Fortune

on:
  workflow_dispatch:
  push:
    paths:
      - "games/wheel-of-fortune/**"
      - "packages/platform-contracts/**"
      - "packages/realtime-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-wheel-of-fortune-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.invalid
      VITE_PLATFORM_URL: https://platform.example.invalid
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Require public build configuration
        run: test -n "$VITE_API_URL" && test -n "$VITE_PLATFORM_URL"
      - run: npm ci
      - run: npm run test:wheel-of-fortune
      - run: npm run build:wheel-of-fortune
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-of-fortune-static-web-app
          path: games/wheel-of-fortune/dist
