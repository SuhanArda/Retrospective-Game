name: Azure readiness - Rus Ruleti

on:
  workflow_dispatch:
  push:
    paths:
      - "games/rus-ruleti/**"
      - "packages/platform-contracts/**"
      - "packages/realtime-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-rus-ruleti-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Readiness-only values. A deployment workflow must map real Azure URLs.
      VITE_API_URL: https://api.example.invalid
      VITE_PLATFORM_URL: https://platform.example.invalid
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      # This game falls back to localhost when a URL is absent instead of
      # failing the build, so the guard has to be explicit here.
      - name: Require public build configuration
        run: test -n "$VITE_API_URL" && test -n "$VITE_PLATFORM_URL"
      - run: npm ci
      - run: npm run test:rus-ruleti
      - run: npm run build:rus-ruleti
      - uses: actions/upload-artifact@v7
        with:
          name: rus-ruleti-static-web-app
          path: games/rus-ruleti/dist
