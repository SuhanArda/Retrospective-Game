name: Azure readiness - Retro Rush

on:
  workflow_dispatch:
  push:
    paths:
      - "games/retro-rush/**"
      - "packages/platform-contracts/**"
      - "packages/realtime-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-retro-rush-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.PUBLIC_API_URL }}
      VITE_AI_BOT_URL: ${{ vars.PUBLIC_AI_BOT_URL }}
      VITE_PLATFORM_URL: ${{ vars.PUBLIC_PLATFORM_URL }}
      VITE_TRANSPORT_MODE: signalr
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Require public build configuration
        run: test -n "$VITE_API_URL" && test -n "$VITE_AI_BOT_URL" && test -n "$VITE_PLATFORM_URL"
      - run: npm ci
      - run: npm run build:retro-rush
      - uses: actions/upload-artifact@v7
        with:
          name: retro-rush-static-web-app
          path: games/retro-rush/dist

