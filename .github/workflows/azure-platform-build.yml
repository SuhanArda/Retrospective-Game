name: Azure readiness - Platform Website

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/retro-platform-web/**"
      - "packages/platform-contracts/**"
      - "packages/realtime-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-platform-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Readiness-only values. A deployment workflow must map real Azure URLs.
      VITE_API_URL: https://api.example.invalid
      VITE_RETRO_RUSH_URL: https://rush.example.invalid
      VITE_SPIN_THE_BOTTLE_URL: https://spin.example.invalid
      VITE_RUS_RULETI_URL: https://rus-ruleti.example.invalid
      VITE_DRAW_AND_GUESS_URL: https://draw-and-guess.example.invalid
      VITE_IMPOSTER_URL: https://imposter.example.invalid
      VITE_ROOM_SERVICE: real
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Require public build configuration
        run: |
          for name in VITE_API_URL VITE_RETRO_RUSH_URL VITE_SPIN_THE_BOTTLE_URL \
                      VITE_RUS_RULETI_URL VITE_DRAW_AND_GUESS_URL VITE_IMPOSTER_URL; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: platform-static-web-app
          path: apps/retro-platform-web/dist
