name: Deploy - Realtime Backend

# Manual only. Deploying restarts the App Service, and RoomManager holds all
# room state in process memory, so every active room is destroyed on deploy.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  APP_NAME: app-retro-game-api-dev-001
  RESOURCE_GROUP: rg-innovation-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test services/retrospective-server.Tests --configuration Release
      - run: dotnet publish services/retrospective-server --configuration Release --output artifacts/retrospective-server
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # RoomManager is not shared across workers, so a second instance would
      # split room state. Fail the deploy instead of serving a broken topology.
      - name: Require a single worker
        run: |
          workers=$(az webapp config show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query numberOfWorkers -o tsv)
          test "$workers" = "1" || { echo "Expected 1 worker, found $workers"; exit 1; }
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: artifacts/retrospective-server
      - name: Verify health
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://${APP_NAME}.azurewebsites.net/health" || true)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            echo "attempt $attempt: HTTP ${code:-none}"; sleep 10
          done
          echo "Health check never returned 200."; exit 1
