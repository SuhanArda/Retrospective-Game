name: Azure readiness - Tank Battle

on:
  workflow_dispatch:
  push:
    paths:
      - "games/tank-battle/**"
      - "packages/platform-contracts/**"
      - "packages/realtime-client/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/azure-tank-battle-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://api.example.invalid
      VITE_PLATFORM_URL: https://platform.example.invalid
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
      - name: Require public build configuration
        run: test -n "$VITE_API_URL" && test -n "$VITE_PLATFORM_URL"
      - run: npm ci
      - run: npm run build:tank-battle
      - uses: actions/upload-artifact@v7
        with:
          name: tank-battle-static-web-app
          path: games/tank-battle/dist
